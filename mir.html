<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pumpkin Patch Prizes (mirrored, 4 pumpkins)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4e8f6;
    --halo: rgba(255, 170, 60, 0.28);
    --ink: #2a1636;
    --muted: #6b4f7a;
    --panel: #ffffff;
    --panel-line: #dcc6e6;
    --scrim: rgba(30, 10, 45, 0.55);
    --focus: #b45309;
    --orange: #f28a1e;
    --orange-hot: #ff9d3a;
    --on-orange: #2a1200;
    --shadow: rgba(60, 20, 80, 0.22);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #150d20;
      --halo: rgba(255, 140, 30, 0.16);
      --ink: #fbeedd;
      --muted: #b9a2c9;
      --panel: #241533;
      --panel-line: #3d2754;
      --scrim: rgba(8, 3, 14, 0.7);
      --focus: #ffb347;
      --shadow: rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #150d20;
    --halo: rgba(255, 140, 30, 0.16);
    --ink: #fbeedd;
    --muted: #b9a2c9;
    --panel: #241533;
    --panel-line: #3d2754;
    --scrim: rgba(8, 3, 14, 0.7);
    --focus: #ffb347;
    --shadow: rgba(0, 0, 0, 0.5);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--bg);
    background-image: radial-gradient(70% 45% at 50% 0%, var(--halo), transparent 70%);
    color: var(--ink);
    font-family: Nunito, "Avenir Next", system-ui, sans-serif;
    font-weight: 600;
    line-height: 1.5;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 3rem;
    text-align: center;
  }
  h1 {
    font-family: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    font-weight: 400;
    font-size: clamp(2.2rem, 7vw, 3.6rem);
    line-height: 1.05;
    margin: 0 0 .6rem;
    color: var(--orange);
    letter-spacing: .01em;
    text-wrap: balance;
  }
  .lede { margin: 0 auto 2rem; max-width: 34ch; color: var(--muted); font-size: 1.1rem; }

  /* ---------- pumpkin grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1rem 1.5rem;
    max-width: 30rem;
    margin-inline: auto;
  }
  /* Phones: keep all four pumpkins (2 x 2) on one screen. */
  @media (max-width: 520px) {
    main { padding: 1rem .75rem 2rem; }
    h1 { font-size: 1.9rem; margin-bottom: .3rem; }
    .lede { font-size: 1rem; margin-bottom: .75rem; min-height: 0; }
    .grid {
      gap: .2rem .75rem;
      max-width: min(100%, calc((100vh - 15.6rem) * 1.05));
      margin-inline: auto;
    }
    .chip-row { min-height: 2.4rem; margin-top: .15rem; }
    .chip { font-size: .8rem; padding: .15em .5em; text-align: center; }
    .status { min-height: 2.6rem; margin-top: .5rem; font-size: 1rem; }
    .pumpkin { border-radius: 16px; }
  }
  .cell { display: flex; flex-direction: column; align-items: stretch; }

  .pumpkin {
    appearance: none;
    background: none;
    border: 0;
    padding: 0;
    width: 100%;
    cursor: pointer;
    border-radius: 28px;
    color: inherit;
    transition: transform .25s cubic-bezier(.3,1.4,.5,1), opacity .5s ease, filter .5s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .pumpkin svg { display: block; width: 100%; height: auto; overflow: visible; }
  .pumpkin:not(:disabled):hover { transform: translateY(-6px) rotate(-2deg); }
  .pumpkin:not(:disabled):active { transform: translateY(-2px) scale(.97); }
  .pumpkin:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
  .pumpkin:disabled { cursor: default; }
  .pumpkin.dim { opacity: .5; filter: saturate(.6); }
  .pumpkin.picked { transform: scale(1.06); }

  .shadow { fill: var(--shadow); }

  .pumpkin.shake svg { animation: wiggle .5s ease-in-out; transform-origin: 50% 92%; }
  @keyframes wiggle {
    0%   { transform: rotate(0); }
    20%  { transform: rotate(-7deg); }
    40%  { transform: rotate(7deg); }
    60%  { transform: rotate(-5deg); }
    80%  { transform: rotate(4deg); }
    100% { transform: rotate(0); }
  }

  /* inner glow + carved face */
  .num {
    font-family: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    fill: #fff4d6;
    stroke: #7a3204;
    stroke-width: 6;
    stroke-linejoin: round;
    paint-order: stroke;
    pointer-events: none;
    transition: opacity .35s ease;
  }
  .pumpkin.carving .num { opacity: 0; }

  .glow { opacity: 0; transition: opacity .9s ease .8s; pointer-events: none; }
  .pumpkin.lit .glow { opacity: .8; }

  .face { display: none; }
  .pumpkin.carving .face { display: block; }
  .face path {
    fill: url(#cutGrad);
    fill-opacity: 0;
    stroke: #6b2a02;
    stroke-width: 2.6;
    stroke-linejoin: round;
    stroke-linecap: butt;
    stroke-dasharray: 1 1;
    stroke-dashoffset: 1;
  }
  .pumpkin.carving .face path {
    animation:
      draw .7s ease-out calc(var(--i) * .12s) forwards,
      fillin .45s ease-out calc(.65s + var(--i) * .12s) forwards;
  }
  .pumpkin.lit .face { filter: drop-shadow(0 0 5px rgba(255, 208, 70, .95)); }
  @keyframes draw   { to { stroke-dashoffset: 0; } }
  @keyframes fillin { to { fill-opacity: 1; } }

  .bit { fill: #ff9a2a; stroke: #b45309; stroke-width: 1; transform-box: fill-box; transform-origin: center; animation: fall 1.1s cubic-bezier(.4,0,.9,.6) forwards; }
  @keyframes fall {
    0%   { transform: translate(0, 0) rotate(0); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
  }

  /* peek chips */
  .chip-row { display: flex; justify-content: center; align-items: flex-start; min-height: 3.1rem; margin-top: .4rem; }
  .chip {
    display: inline-flex; align-items: center; justify-content: center; gap: .35em;
    padding: .25em .75em;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    font-size: .85rem; font-weight: 800; line-height: 1.25;
    opacity: 0; transform: translateY(-4px);
    transition: opacity .4s ease, transform .4s ease;
  }
  .peek .chip { opacity: 1; transform: none; }
  .chip.win { border-color: var(--orange); box-shadow: 0 0 0 2px color-mix(in srgb, var(--orange) 40%, transparent); }

  /* status line */
  .status {
    min-height: 3.4rem; margin-top: 1.25rem;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: .75rem 1rem;
    font-size: 1.1rem;
  }
  .status .won { font-weight: 800; }

  .btn {
    appearance: none; border: 0; cursor: pointer;
    font: inherit; font-weight: 800;
    padding: .65em 1.4em; border-radius: 999px;
    background: var(--orange); color: var(--on-orange);
    transition: background .15s ease, transform .15s ease;
  }
  .btn:hover { background: var(--orange-hot); transform: translateY(-1px); }
  .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--panel-line); }
  .btn.ghost:hover { background: var(--panel); }

  /* prize card */
  .scrim {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: center;
    padding: calc(1rem + env(safe-area-inset-top, 0px)) 1rem calc(1rem + env(safe-area-inset-bottom, 0px));
    background: var(--scrim);
    animation: fadein .35s ease;
  }
  .scrim[hidden] { display: none; }
  @keyframes fadein { from { opacity: 0; } }
  .card {
    width: min(92vw, 380px);
    background: var(--panel);
    border: 2px solid var(--panel-line);
    border-radius: 28px;
    padding: 2rem 1.5rem 1.5rem;
    text-align: center;
    box-shadow: 0 0 60px rgba(255, 160, 40, .35);
    animation: rise .5s cubic-bezier(.3,1.4,.5,1);
  }
  @keyframes rise { from { transform: translateY(24px) scale(.9); opacity: 0; } }
  .card .emoji {
    display: block; font-size: 5.5rem; line-height: 1.1; margin-bottom: .25rem;
    animation: pop .7s cubic-bezier(.3,1.6,.5,1) .15s both;
    filter: drop-shadow(0 0 18px rgba(255, 190, 60, .7));
  }
  @keyframes pop { from { transform: scale(0) rotate(-25deg); } }
  .card h2 { font-family: "Bagel Fat One", "Arial Rounded MT Bold", system-ui, sans-serif; font-weight: 400; font-size: 1.5rem; margin: 0 0 .25rem; color: var(--orange); }
  .card .prize-name { font-size: 1.35rem; font-weight: 800; margin: 0 0 1.5rem; text-wrap: balance; }
  .card .actions { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; }

  [hidden] { display: none !important; }

  /* (unused editor styles) */
  details.editor { margin: 2.25rem auto 0; max-width: 460px; text-align: left; color: var(--muted); }
  details.editor summary { cursor: pointer; text-align: center; text-decoration: underline; text-underline-offset: 3px; }
  details.editor summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
  details.editor p { margin: .9rem 0 .5rem; font-size: .95rem; }
  textarea {
    width: 100%; font: inherit; font-weight: 600; line-height: 1.6;
    color: var(--ink); background: var(--panel);
    border: 2px solid var(--panel-line); border-radius: 14px; padding: .75rem 1rem;
    resize: vertical;
  }
  textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .editor-actions { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; margin-top: .75rem; }
  .msg { font-size: .95rem; }



  /* Mirrored for selfie-mode filming: the title, the game and the prize card are flipped
     left-to-right. The "Edit prizes" panel stays normal so it's easy to use. */
  h1, #gameView, .scrim { transform: scaleX(-1); }

  /* prize editor */
  .prizes-editor { max-width: 520px; margin: 2.25rem auto 0; text-align: left; }
  .prizes-editor[hidden] { display: none; }
  .prizes-editor summary { cursor: pointer; text-align: center; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
  .prizes-editor summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
  .prizes-editor .hint { margin: .9rem 0 .75rem; color: var(--muted); font-size: .95rem; }
  .prize-row { display: grid; grid-template-columns: 5.5rem 4rem 1fr; gap: .5rem; align-items: center; margin-bottom: .5rem; }
  .prize-row .which { color: var(--muted); font-size: .9rem; }
  .prize-row input {
    width: 100%; font: inherit; font-weight: 600; color: var(--ink); background: var(--panel);
    border: 2px solid var(--panel-line); border-radius: 12px; padding: .5rem .75rem;
  }
  .prize-row input.emoji { text-align: center; font-size: 1.25rem; padding: .35rem .25rem; }
  .prize-row input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .editor-actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: .9rem; }
  .edit-msg { min-height: 1.5em; margin: .75rem 0 0; font-size: .95rem; color: var(--muted); }
  .edit-msg.err { color: var(--danger, #b3261e); }
  @media (max-width: 420px) { .prize-row { grid-template-columns: 3.5rem 1fr; } .prize-row .which { grid-column: 1 / -1; } }

  @media (prefers-reduced-motion: reduce) {
    .pumpkin, .glow, .chip { transition: none; }
    .pumpkin.shake svg { animation: none; }
    .pumpkin.carving .face path { animation: none; stroke-dashoffset: 0; fill-opacity: 1; }
    .bit { display: none; }
    .scrim, .card, .card .emoji { animation: none; }
  }
</style>
</head>
<body>

<!-- shared gradients for every pumpkin -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="lobeDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c25a0a"/><stop offset="1" stop-color="#e57a12"/>
    </linearGradient>
    <linearGradient id="lobeMid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9780f"/><stop offset=".5" stop-color="#fb9420"/><stop offset="1" stop-color="#ea790f"/>
    </linearGradient>
    <linearGradient id="lobeLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f98a1a"/><stop offset=".5" stop-color="#ffab3f"/><stop offset="1" stop-color="#f98a1a"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff3a6" stop-opacity="1"/>
      <stop offset=".55" stop-color="#ffc43d" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ff8a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cutGrad" cx=".5" cy=".45" r=".7">
      <stop offset="0" stop-color="#fffbd0"/><stop offset="1" stop-color="#ffcf45"/>
    </radialGradient>
  </defs>
</svg>

<main>
  <h1>Pumpkin Patch Prizes</h1>

  <div id="gameView">
  <p class="lede">Pick a pumpkin. Each one is hiding a different prize.</p>

  <div class="grid" id="grid"></div>

  <div class="status" id="status" aria-live="polite">
    <span id="statusText"></span>
    <button class="btn" id="againBar" hidden>Play again</button>
  </div>
  </div>

  <section class="prizes-editor" id="editor" hidden>
    <details id="editorDetails">
      <summary>Edit prizes</summary>
      <p class="hint">Change any of the four prizes, then save. Your changes are kept in this browser.</p>
      <div id="prizeRows"></div>
      <div class="editor-actions">
        <button class="btn" id="savePrizes" type="button">Save prizes</button>
        <button class="btn ghost" id="resetPrizes" type="button">Reset</button>
      </div>
      <p class="edit-msg" id="editMsg" role="status"></p>
    </details>
  </section>
</main>

<div class="scrim" id="scrim" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="prizeTitle">
    <span class="emoji" id="prizeEmoji" aria-hidden="true"></span>
    <h2 id="prizeTitle">You found a prize!</h2>
    <p class="prize-name" id="prizeName"></p>
    <div class="actions">
      <button class="btn ghost" id="peek">Peek at the others</button>
      <button class="btn" id="again">Play again</button>
    </div>
  </div>
</div>

<script>
(function () {
  // ---- Change these to change the prizes (exactly four) ----
  var DEFAULT_PRIZES = [
    { emoji: "📸", name: "Photo" },
    { emoji: "🎥", name: "Video" },
    { emoji: "👻", name: "Snap" },
    { emoji: "🎬", name: "Clip" }
  ];
  var STORE_KEY = "pumpkin-prizes-4-v1";

  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Carved faces. Each string is one cut-out shape.
  var FACES = [
    [ "M64 106 L77 82 L90 106 Z",
      "M110 106 L123 82 L136 106 Z",
      "M95 116 L105 116 L100 108 Z",
      "M60 122 Q100 164 140 122 Q100 134 60 122 Z" ],
    [ "M69 100 a9 9 0 1 0 18 0 a9 9 0 1 0 -18 0 Z",
      "M113 100 a9 9 0 1 0 18 0 a9 9 0 1 0 -18 0 Z",
      "M68 120 Q100 128 132 120 Q128 152 100 152 Q72 152 68 120 Z" ],
    [ "M64 104 Q77 84 90 104 Q77 95 64 104 Z",
      "M110 104 Q123 84 136 104 Q123 95 110 104 Z",
      "M97 114 Q100 119 103 114 Q100 112 97 114 Z",
      "M80 126 Q100 144 120 126 Q100 134 80 126 Z" ],
    [ "M66 96 L78 80 L90 96 L78 104 Z",
      "M110 96 L122 80 L134 96 L122 104 Z",
      "M58 118 Q100 130 142 118 L134 136 L122 128 L112 144 L100 132 L88 144 L78 128 L66 136 Z" ]
  ];

  var grid = document.getElementById("grid");
  var statusText = document.getElementById("statusText");
  var againBar = document.getElementById("againBar");
  var scrim = document.getElementById("scrim");
  var prizeEmoji = document.getElementById("prizeEmoji");
  var prizeName = document.getElementById("prizeName");
  var peekBtn = document.getElementById("peek");
  var againBtn = document.getElementById("again");

  // ---- which prizes to use: saved in this browser > defaults ----
  function clean(list) {
    if (!Array.isArray(list) || list.length !== 4) return null;
    var out = list.map(function (p) {
      var emoji = String((p && p.emoji) || "").trim().slice(0, 8) || "🎁";
      var name = String((p && p.name) || "").trim().slice(0, 40);
      return { emoji: emoji, name: name };
    });
    return out.every(function (p) { return p.name; }) ? out : null;
  }
  function savedPrizes() {
    try { return clean(JSON.parse(localStorage.getItem(STORE_KEY))); } catch (e) { return null; }
  }
  var prizes = savedPrizes() || DEFAULT_PRIZES.slice();
  var order = [];
  var picked = -1;
  var timers = [];

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  function pumpkinSVG(n) {
    return '' +
    '<svg viewBox="0 0 200 190" aria-hidden="true" focusable="false">' +
      '<ellipse class="shadow" cx="100" cy="181" rx="66" ry="8"/>' +
      '<ellipse cx="52" cy="110" rx="42" ry="58" fill="url(#lobeDark)" stroke="#9c3f06" stroke-width="2.5"/>' +
      '<ellipse cx="148" cy="110" rx="42" ry="58" fill="url(#lobeDark)" stroke="#9c3f06" stroke-width="2.5"/>' +
      '<ellipse cx="78" cy="110" rx="42" ry="64" fill="url(#lobeMid)" stroke="#9c3f06" stroke-width="2.5"/>' +
      '<ellipse cx="122" cy="110" rx="42" ry="64" fill="url(#lobeMid)" stroke="#9c3f06" stroke-width="2.5"/>' +
      '<ellipse cx="100" cy="110" rx="36" ry="68" fill="url(#lobeLight)" stroke="#9c3f06" stroke-width="2.5"/>' +
      '<ellipse cx="60" cy="74" rx="7" ry="15" fill="#fff" opacity=".28" transform="rotate(-24 60 74)"/>' +
      '<text class="num" x="100" y="134" text-anchor="middle" font-size="66">' + n + '</text>' +
      '<ellipse class="glow" cx="100" cy="112" rx="80" ry="58" fill="url(#glowGrad)"/>' +
      '<g class="face"></g>' +
      '<path d="M86 48 C70 36 58 40 54 48 C66 54 78 54 86 48 Z" fill="#7bab3d" stroke="#46661c" stroke-width="2" stroke-linejoin="round"/>' +
      '<path d="M112 42 C128 30 142 36 138 46 C135 53 126 50 129 44" fill="none" stroke="#5e8f2f" stroke-width="3" stroke-linecap="round"/>' +
      '<path d="M89 50 C86 34 91 24 100 19 C109 22 115 29 112 50 Z" fill="#6a8a2e" stroke="#3d5418" stroke-width="2.5" stroke-linejoin="round"/>' +
      '<g class="bits"></g>' +
    '</svg>';
  }

  function newRound() {
    clearTimers();
    picked = -1;
    order = shuffle(prizes);
    scrim.hidden = true;
    grid.classList.remove("peek");
    statusText.textContent = "";
    againBar.hidden = true;

    var html = "";
    for (var i = 0; i < 4; i++) {
      html += '<div class="cell">' +
        '<button type="button" class="pumpkin" data-i="' + i + '" aria-label="Pumpkin ' + (i + 1) + ' of 4">' +
          pumpkinSVG(i + 1) +
        '</button>' +
        '<div class="chip-row"><span class="chip" data-chip="' + i + '">' +
          '<span aria-hidden="true">' + esc(order[i].emoji) + '</span> ' + esc(order[i].name) +
        '</span></div>' +
      '</div>';
    }
    grid.innerHTML = html;
  }

  function spawnBits(btn) {
    var g = btn.querySelector(".bits");
    if (!g) return;
    var out = "";
    for (var k = 0; k < 12; k++) {
      var x = 66 + Math.random() * 68;
      var y = 96 + Math.random() * 44;
      var dx = (Math.random() - 0.5) * 70;
      var dy = 50 + Math.random() * 70;
      var rot = (Math.random() - 0.5) * 540;
      out += '<g transform="translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ')">' +
        '<path class="bit" d="M0 0 L8 2 L3 9 Z" style="--dx:' + dx.toFixed(0) + 'px;--dy:' + dy.toFixed(0) + 'px;--rot:' + rot.toFixed(0) + 'deg;animation-delay:' + (Math.random() * 0.5).toFixed(2) + 's"/>' +
      '</g>';
    }
    g.innerHTML = out;
  }

  function pick(i) {
    if (picked !== -1) return;
    picked = i;
    var buttons = grid.querySelectorAll(".pumpkin");
    var btn = buttons[i];
    buttons.forEach(function (b, idx) {
      b.disabled = true;
      if (idx === i) b.classList.add("picked");
      else b.classList.add("dim");
    });
    statusText.textContent = "Carving pumpkin " + (i + 1) + "…";

    var face = FACES[Math.floor(Math.random() * FACES.length)];
    var g = btn.querySelector(".face");
    g.innerHTML = face.map(function (d, n) {
      return '<path d="' + d + '" pathLength="1" style="--i:' + n + '"/>';
    }).join("");

    var wiggle = reduceMotion ? 0 : 450;
    if (!reduceMotion) btn.classList.add("shake");
    later(function () {
      btn.classList.remove("shake");
      btn.classList.add("carving", "lit");
      if (!reduceMotion) later(function () { spawnBits(btn); }, 250);
    }, wiggle);

    later(showPrize, reduceMotion ? 500 : 2300);
  }

  function showPrize() {
    var p = order[picked];
    prizeEmoji.textContent = p.emoji;
    prizeName.textContent = p.name;
    statusText.innerHTML = '<span class="won">You won: ' + esc(p.emoji) + ' ' + esc(p.name) + '</span>';
    againBar.hidden = false;
    scrim.hidden = false;
    peekBtn.focus();
  }

  function closeCard(reveal) {
    scrim.hidden = true;
    if (reveal) {
      grid.classList.add("peek");
      var winChip = grid.querySelector('[data-chip="' + picked + '"]');
      if (winChip) winChip.classList.add("win");
    }
    againBar.focus();
  }

  grid.addEventListener("click", function (e) {
    var btn = e.target.closest(".pumpkin");
    if (!btn || btn.disabled) return;
    pick(Number(btn.getAttribute("data-i")));
  });
  peekBtn.addEventListener("click", function () { closeCard(true); });
  againBtn.addEventListener("click", newRound);
  againBar.addEventListener("click", newRound);
  scrim.addEventListener("click", function (e) { if (e.target === scrim) closeCard(false); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !scrim.hidden) closeCard(false);
  });

  // ---- prize editor ----
  var editor = document.getElementById("editor");
  var rowsEl = document.getElementById("prizeRows");
  var editMsg = document.getElementById("editMsg");

  function buildRows() {
    rowsEl.textContent = "";
    prizes.forEach(function (p, i) {
      var row = document.createElement("div");
      row.className = "prize-row";
      var which = document.createElement("span");
      which.className = "which";
      which.textContent = "Pumpkin " + (i + 1);
      var em = document.createElement("input");
      em.className = "emoji"; em.type = "text"; em.maxLength = 8; em.value = p.emoji;
      em.setAttribute("aria-label", "Pumpkin " + (i + 1) + " emoji");
      var nm = document.createElement("input");
      nm.className = "name"; nm.type = "text"; nm.maxLength = 40; nm.value = p.name;
      nm.setAttribute("aria-label", "Pumpkin " + (i + 1) + " prize name");
      row.appendChild(which); row.appendChild(em); row.appendChild(nm);
      rowsEl.appendChild(row);
    });
  }
  function setMsg(text, isErr) { editMsg.textContent = text; editMsg.classList.toggle("err", !!isErr); }
  function readRows() {
    var list = [];
    rowsEl.querySelectorAll(".prize-row").forEach(function (row) {
      list.push({ emoji: row.querySelector(".emoji").value, name: row.querySelector(".name").value });
    });
    return clean(list);
  }
  function savePrizes() {
    var list = readRows();
    if (!list) { setMsg("Every prize needs a name.", true); return false; }
    prizes = list;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(list)); } catch (e) {}
    buildRows();
    newRound();
    setMsg("Saved. A fresh round is ready.");
    return true;
  }
  document.getElementById("savePrizes").addEventListener("click", savePrizes);
  document.getElementById("resetPrizes").addEventListener("click", function () {
    prizes = DEFAULT_PRIZES.slice();
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    buildRows();
    newRound();
    setMsg("Back to the original prizes.");
  });
  buildRows();
  editor.hidden = false;

  newRound();
})();
</script>
</body>
</html>
